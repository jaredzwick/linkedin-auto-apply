# Either use the legacy single-account fields below, OR define `accounts:` for
# multiple accounts. If `accounts:` is non-empty, the top-level username/
# password/phone_number/hometown are ignored.
username:
password:
phone_number:
hometown:
  -  # Your city, used to fill LinkedIn's "Location (city)" typeahead

# Multi-account mode — the bot logs in, runs, logs out, and continues with the
# next account. Each account gets its own daily cap.
# accounts:
#   - username: first@example.com
#     password: ...
#     phone_number: 5555555555
#     hometown: San Diego, CA
#   - username: second@example.com
#     password: ...
#     phone_number: 5555555556
#     hometown: Austin, TX

positions:
  - Data Scientist
  -  # Another position you want to search for
  -  # A third position you want to search for

locations:
  - Remote
  -  # A second location you want to search in

# --------- Optional Parameters -------
# uploads:
#  Resume: # PATH TO Resume
#  Cover Letter: # PATH TO cover letter
#  Photo: # PATH TO photo

# output_filename:
# - # PATH TO OUTPUT FILE (default output.csv)

# blacklist:
# - # Company names you want to ignore

#blackListTitles:
#- # Add job titles you want to ignore
