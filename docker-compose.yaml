version: '3'
services:
  selenium-hub:
    image: selenium/hub
    environment:
      SE_VNC_NO_PASSWORD: 1
    ports:
      - "4444:4444"
    networks:
      - grid-network

  chrome-node:
    image: selenium/node-chrome
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_VNC_NO_PASSWORD: 1
    networks:
      - grid-network

  script:
    build: .
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
    networks:
      - grid-network

networks:
  grid-network:
